name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: "微调 WeiTiao v1.4.1 (Miuix 新版网格视觉)"
          body: |
            ### 微调 (WeiTiao) v1.4.1

            - **全新 Miuix 视觉网格与悬浮胶囊导航重塑**：
              - **底部悬浮圆角胶囊导航栏 (`FloatingNavigationBar`) + `HorizontalPager` 物理弹簧滑页**：常驻 `概览` · `伪装` · `调谐` · `设置` 四大板块，告别套娃式跳页；
              - **顶部主状态横幅大卡 (`MiuixHeroStatusCard`)**：左上大粗体运行状态 + 浅蓝圆点胶囊 + 右下角超大半裁切圆环对勾水印；
              - **3×2 点亮式速控磁贴网格 (`MiuixQuickTile`)**：6 大核心功能与 6 大精选跨区预设均采用 3×2 网格，开启即点亮为柔和浅天蓝底色 (`#E7F0FD`) 与小米蓝 (`#267AF6`)，支持首页直接点击切换开关；
              - **2×2 马卡龙柔和超椭圆图标 + 大数字指标卡 (`MiuixMetricCard`)**：实时展示商店伪装区域、实时电池温度、微信计步策略与伪装机型；
              - **原生大圆角半屏抽屉 (`WindowBottomSheet`) 与行内悬浮下拉菜单 (`WindowDropdown`)**：126 款机型库、目标应用多选与微信计步模式切换全面升级。
            - **极致轻量化**：R8 深度裁剪后正式版安装包依然仅 **1.6 MB**，O(1) 哈希属性查表，零冗余后台唤醒。
          files: |
            releases/WeiTiao-v1.4.1.apk
