name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.8
          name: "微调 WeiTiao v1.4.8 (Modern API 规范化对齐 & 作用域清单净化)"
          body: |
            ### 微调 (WeiTiao) v1.4.8

            - **LSPosed Modern API 102 规范深度对齐（方案 A）**：
              - `<application>` 标签补充 `android:description="@string/xposed_description"`，支持现代 LSPosed 管理器原生展示模块功能介绍；
              - `module.prop` 规范化补充 `description` 属性；
              - 补充标准 `assets/xposed_scope` 作用域配置文件，实现双通道推荐作用域宣告。
            - **作用域清单全面净化与统一**：
              - 彻底清除 `arrays.xml` 中残留的历史作用域包名（`com.android.vending`），使 `scope.list`、`assets/xposed_scope` 与 `res/values/arrays.xml` 达到 100% 绝对一致（聚焦 7 大核心三星商店判区及微信服务）；
              - 保留动态作用域能力，确保 126 款机型伪装仍可自由勾选第三方应用与游戏生效。
          files: |
            releases/WeiTiao-v1.4.8.apk
