name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.6.6.apk
          cd releases
          sha256sum WeiTiao-v1.6.6.apk > WeiTiao-v1.6.6.apk.sha256
          cat WeiTiao-v1.6.6.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.6
          name: "微调 WeiTiao v1.6.6 (新增「亮屏快充」系统控制中心快捷磁贴)"
          body: |
            ### 微调 (WeiTiao) v1.6.6 (`versionCode=46`)

            #### ⚡ 新增「亮屏快充」控制中心快捷磁贴 (`FastChargeTileService`)
            - **下拉面板直接一键开关**：无需进入 App，下拉系统控制中心点击「亮屏快充」磁贴即可直接开启/关闭亮屏快充（无 Root 时自动安全回退并弹窗提示）。
            - **双向实时同步 & 动态副标题**：
              - 磁贴与 App 内亮屏快充开关实时双向同步（App 内切换自动触发 `TileService.requestListeningState` 刷新）；
              - Android 10+ 支持动态副标题实时展示：`已关闭` / `已开启` / `快充中` / `xx.xW 快充中` / `高温保护`。
            - **长按直达 & 一键添加到快捷面板**：
              - 长按系统控制中心磁贴可直接跳转微调主页（`QS_TILE_PREFERENCES`）；
              - 在「亮屏快充」详情页新增「快捷控制中心磁贴」入口，Android 13+ 一键弹窗添加到下拉面板。

            - **验证状态**：
              - 本地单元测试 15 个套件共 136 项全部通过（0 失败 0 跳过，含 `FastChargeSafetyTest` 新增的快捷磁贴多状态展示用例）；R8 Release APK 编译通过。
          files: |
            releases/WeiTiao-v1.6.6.apk
            releases/WeiTiao-v1.6.6.apk.sha256
