name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.5.8.apk
          cd releases
          sha256sum WeiTiao-v1.5.8.apk > WeiTiao-v1.5.8.apk.sha256
          cat WeiTiao-v1.5.8.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.8
          name: "微调 WeiTiao v1.5.8 (大幅降低亮屏快充 root sh 轮询 CPU 占用与缺页开销)"
          body: |
            ### 微调 (WeiTiao) v1.5.8

            - **亮屏快充 root sh 子进程极致降耗优化 (`FastChargeController` / `BrightScreenFastChargeService`)**：
              - `readBatteryMetrics()` 全程改用 `mksh` 内建 `read -r var < file` 替代外部 `$(cat ... | head -n 1)`；在持久化 `su` 会话中缓存 `__wt_uid` 与电池热区路径 `__wt_tzb`（消除每次轮询遍历 80+ 个 `thermal_zone*`），并将被 `0000` 屏蔽节点的临时提权与恢复合并为单次批量 `stat` + `chmod`，将每轮外部子进程派生从约 85 次降至 0~4 次。
              - 将 `blockTemperatureNodes()`、`restoreTemperatureNodes()`、`areTemperatureNodesBlocked()` 与 `isAnyTemperatureNodeBlocked()` 合并为批量 `chmod` 与单次 `stat -c '%a:%n'` 解析，消除逐节点循环 `fork+execve`。
              - `BrightScreenFastChargeService` 在 `100%` 满电未过热阶段自动将采样间隔降频至 15s、权限复核降频至 30s，并将小幅功率波动（`< 0.8W`）通知节流窗口调整为 15s，同时避免 `onResume` 重复下发系统设置。
              - 真机 20s 对比实测：`root sh` 自身缺页降低约 98.9%，子进程缺页降低约 99.3%，CPU 占用降至约 0.6% 单核（降幅约 98%）。
          files: |
            releases/WeiTiao-v1.5.8.apk
            releases/WeiTiao-v1.5.8.apk.sha256
