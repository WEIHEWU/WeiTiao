name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.3
          name: "微调 WeiTiao v1.4.3 (极简一页式与精致小字号版)"
          body: |
            ### 微调 (WeiTiao) v1.4.3

            - **极简一页式聚合，彻底消除重复按钮与底部悬浮栏**：
              - **移除底部悬浮导航栏与冗余看板卡**：全应用精简为清爽单页控制台，右上角图标进入高级设置；
              - **6 大核心开关全局唯一**：顶部 `3×2` 点亮式小按钮（`商店跨区`、`机型伪装`、`微信计步`、`防撤回`、`亮屏快充`、`旁路供电`）作为全应用唯一的开关入口，下方卡片仅放置纯粹的参数配置项与快捷维护，零重复按钮。
            - **全面缩小全应用字号，精致紧凑排版**：
              - 去除原本硕大的 30sp 折叠大标题与 17sp 列表项标题，全面调小为紧凑精致字号（17sp 顶栏、18sp 状态卡、13sp 列表标题、10.5sp–11sp 副标题与磁贴文字）。
            - **极致轻量化**：R8 深度裁剪后正式版安装包仅 **1.6 MB**，O(1) 哈希属性查表，零冗余后台唤醒。
          files: |
            releases/WeiTiao-v1.4.3.apk
