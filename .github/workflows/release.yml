name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "微调 WeiTiao v1.5.0 (底层 Native COW 内存属性引擎 & iPhone 伪装支持)"
          body: |
            ### 微调 (WeiTiao) v1.5.0

            - **突破性底层 Native COW 内存属性改写引擎 (NativePropCow)**：
              - 攻破 iPhone/Apple 及跨品牌机型在加固防篡改应用（腾讯乐固/加固、酷安、QQ 等）中失效的难题；
              - 精准读取 `/proc/self/maps`，通过 `mmap(MAP_PRIVATE | MAP_FIXED)` 将 `/dev/__properties__/*` 共享内存映射重置为私有写时复制（COW）物理页；
              - 通过直接内存指针与原子 `serial` 序列号快速写入伪装值，使 Native libc (`__system_property_get` / `__system_property_read_callback`) 与 Java 层 `Build.*` 返回值达到 100% 绝对一致；
              - 毫秒级极速注入（~1.5ms），无需依赖系统层修改或守护进程，极度稳定轻量。
            - **机型伪装生效应用保存时自动联动 LSPosed 作用域 (Root 静默同步)**：
              - 在应用选择界面点击保存时，若具备 Root 权限自动直连 LSPosed 核心数据库完成模块作用域同步，免去手动去 LSPosed 勾选并重启的繁琐链路；无 Root 时无缝直达 LSPosed 作用域管理界面。
            - **全球主流机型库深度翻新与净化（严格执行三年时效与纯旗舰标准）**：
              - 全新收录 2023.10 - 2026.10 期间的纯血机皇与顶级折叠旗舰（iPhone Duo、iPhone 18/17/16 Pro Max、OnePlus 16、Xiaomi 17 全系、Galaxy S26/S25/S24、Pixel 10 Pro Fold、HUAWEI Mate XT 等）；
              - 彻底清退超过 3 年的老旧机型与入门中端系列，保证纯血旗舰体验；
              - 主界面伪装机型卡片动态展示当前库容量。
          files: |
            releases/WeiTiao-v1.5.0.apk
