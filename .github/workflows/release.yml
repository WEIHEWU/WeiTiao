name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: "微调 WeiTiao v1.4.2 (Miuix 去重与完整排版精修版)"
          body: |
            ### 微调 (WeiTiao) v1.4.2

            - **消除重复按钮与文案截断精修**：
              - **去除跨页面与同页面重复控件**：移除 `伪装` 与 `调谐` 页顶部与 `概览` 页重复的指标卡片，将 `设备型号伪装` 双卡片与开关整合为单一清爽卡片，移除 `调谐` 页重复的重启微信按钮；
              - **彻底解决全界面文案截断 (`...`)**：
                - 6 大精选国家/地区预设升级为 **2×3 双列宽幅磁贴**，国旗、地区名与 CSC/MCC 代码完整显示；
                - 概览页 3×2 速控磁贴与 2×2 实时看板采用精炼短标签与自适应双行排版；
                - 手动 CSC / 国家代码 / MCC 输入框与微信计步参数输入框调整为宽幅两行布局，标签完整呈现；
                - 分组卡片副标题改为独立完整描述行，不再挤压右侧空间。
            - **极致轻量化**：R8 深度裁剪后正式版安装包仅 **1.6 MB**，O(1) 哈希属性查表，零冗余后台唤醒。
          files: |
            releases/WeiTiao-v1.4.2.apk
