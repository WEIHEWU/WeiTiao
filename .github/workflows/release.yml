name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.6.0.apk
          cd releases
          sha256sum WeiTiao-v1.6.0.apk > WeiTiao-v1.6.0.apk.sha256
          cat WeiTiao-v1.6.0.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "微调 WeiTiao v1.6.0 (满电自动归还原生温控 & 芯片温控熔断收紧)"
          body: |
            ### 微调 (WeiTiao) v1.6.0

            - **满电自动归还系统原生温控 (`FastChargeController` / `BrightScreenFastChargeService` / `FastChargeWatchdog`)**：
              - 新增 `100%` 满电释放 / `98%` 滞回恢复策略（`nextFullChargeReleased` 与 `shouldBlockChargingNodes`），在 `99%～100%` 满电/USB 调试插电期间不再屏蔽电池温度 sysfs 节点，确保系统 `ThermalHAL` 的 `BAT`/`SKIN` 保持真实温度与官方温控降频曲线。
              - 前台服务与兜底任务 `FastChargeFallback.applyNow` 共享同一满电释放判定，防止兜底触发时误锁温控节点。
            - **芯片温度熔断收紧 (`FastChargeController.isOverheated`)**：
              - 将 AP/PA/CHG 芯片熔断上限收紧至 `(clampedCutoff + 3).coerceAtMost(47)`（`3.0°C` 回落滞回），缩小与官方 `SKIN` 降频曲线的温差盲区。
            - **常驻通知状态提示 (`FastChargeNotifier`)**：
              - 满电保护态下常驻通知显示 `满电保护恢复原生温控 · 电量:...`，直观反馈当前已自动交还系统温控。
          files: |
            releases/WeiTiao-v1.6.0.apk
            releases/WeiTiao-v1.6.0.apk.sha256
