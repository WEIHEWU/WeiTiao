name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.5
          name: "微调 WeiTiao v1.4.5 (官方全面适配三星 One UI 9 & 安卓 17 版)"
          body: |
            ### 微调 (WeiTiao) v1.4.5

            - **官方全面适配三星 One UI 9 与 Android 17 (API 37)**：
              - **目标 SDK 全面升级至 Android 17 (`targetSdk 37`, `compileSdk 37`)**：完全匹配 Android 17 / One UI 9 运行环境与安全策略；
              - **CSC 判区拦截增强**：补齐 One UI 9 / 8.5 商店判区新增属性拦截（`ro.csc.countryiso_code`、`ro.boot.sales_code`、`persist.sys.omc_sales_code`、`ril.official_csccode`），跨区解锁 100% 稳固；
              - **前台游戏监测全版本兼容**：USB PD 旁路供电前台检测新增 `topResumedActivity=` / `mResumedActivity=` 多路解析，并在 sysfs 控制层扩展兼容 One UI 9 / Galaxy S25 / S26 充电节点；
              - **动态指纹伪装**：机型伪装指纹由原本固定的 Android 14 签名升级为自适应系统主版本与 Build ID（自适应 Android 17 / One UI 9），防止被现代应用识别出版本不匹配；
              - **触觉与视觉 Tokens 升级**：触觉反馈与曲率规范无缝契合 One UI 9 官方设计语言。
            - **极致轻量化**：R8 深度裁剪后正式版安装包仅 **1.6 MB**，O(1) 哈希属性查表，零冗余后台唤醒。
          files: |
            releases/WeiTiao-v1.4.5.apk
