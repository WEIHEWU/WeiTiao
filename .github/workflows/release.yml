name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.6.2.apk
          cd releases
          sha256sum WeiTiao-v1.6.2.apk > WeiTiao-v1.6.2.apk.sha256
          cat WeiTiao-v1.6.2.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.2
          name: "微调 WeiTiao v1.6.2 (修复无 Root 下快充节点同步死循环与 su 日志刷屏)"
          body: |
            ### 微调 (WeiTiao) v1.6.2 (`versionCode=42`)

            - **根治无 Root 权限下的 `scheduleNodeSync` 死循环与 CPU 空转 (`BrightScreenFastChargeService`)**：
              - 新增 `shouldContinueNodeSyncLoop`（同步失败 `syncFailed` 立即终止，且限定 `MAX_SYNC_LOOP_ITERATIONS = 4` 上限），彻底消除 `appliedBlocked == null` 引发的 10ms 级无限自旋；
              - 新增 `NO_ROOT_RETRY_COOLDOWN_MS = 60_000L`（60 秒）冷却机制与无阻塞 `isRootRetryInCooldown` 判定，避免反复轮询重试并保证 `RootShell.hasRoot()` 检查不再阻塞主线程；
              - 后台探针发现 Root 恢复授权（`peekCachedHasRoot() == true`）时自动解除冷却并恢复节点控制。
            - **消除无 Root 时的 `su` 重复拉起与日志刷屏 (`RootShell` / `FastChargeController` / `App` / `PassThroughService`)**：
              - `execPersistent` 仅在复用会话中途断开或超时时回退 `execOneShot`，首次拉起 `su` 失败或立即 EOF 退出时不再重复 spawn 第二次并把失败日志按 30 秒节流为 `Log.w`；
              - `FastChargeController.readBatteryMetrics`、`App.onCreate` 自愈与 `PassThroughService` 前置 `RootShell.hasRoot()` 判断，无 Root 时优雅降级为系统 `BatteryManager` 读取。
            - **单元测试与真机验证**：
              - `FastChargeSafetyTest` 新增同步循环终止、60s 冷却与 30s 日志节流用例（15 个套件 / 130 项测试全部通过）；
              - `SM-S928B` 真机同签名覆盖安装后运行稳定：单持久 `su` 会话无高频 fork、满电保护下温控节点维持 `644`、`CPU 0.0%`、配置零漂移。
          files: |
            releases/WeiTiao-v1.6.2.apk
            releases/WeiTiao-v1.6.2.apk.sha256
