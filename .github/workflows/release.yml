name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.6.3.apk
          cd releases
          sha256sum WeiTiao-v1.6.3.apk > WeiTiao-v1.6.3.apk.sha256
          cat WeiTiao-v1.6.3.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3
          name: "微调 WeiTiao v1.6.3 (仅充电显示快充通知、根治死循环与温控降频采样)"
          body: |
            ### 微调 (WeiTiao) v1.6.3 (`versionCode=43`)

            - **仅在真正充电时运行亮屏快充通知与服务 (`FastChargeReceiver` / `BrightScreenFastChargeService` / `FastChargeNotifier` / `TuningConfig`)**：
              - 在 `FastChargeReceiver`（`goAsync()` 后台处理）、`FastChargeFallback.applyNow` 与 `TuningPrefs.resyncServices` / `syncServices` 调用方前置校验积极充电与 `isRootSuspended` 状态，未充电或无 Root 挂起时不调用 `startForegroundService()`；
              - 服务 `onStartCommand` 不在主线程阻塞执行 `su`，若由 `startForegroundService()` 拉起后需立即退出，统一按 `NO_ROOT` → `!isWiredCharging` → `FULL_CHARGE` → `ACTION_STOP_STANDBY` 优先级绑定 `IMPORTANCE_NONE` 隐藏通知（`allowLiveReuse = false`）并主线程立即 `cancelLive` + `stopForeground` + `stopSelf()`，声明为 `START_NOT_STICKY`，避免 `ForegroundServiceDidNotStartInTimeException`。
            - **满电 100% 方案 A 与拔插重触发闭环 (`FastChargeController` / `App` / `FastChargeWatchdog`)**：
              - 达到 `BATTERY_STATUS_FULL` 时立即释放温控节点、隐藏通知并停止后台轮询；
              - 进程级动态 `powerReceiver` 配合 `FastChargeJobService` 维持「满电退出 → 拔线 → 下次插线」自动触发闭环。
            - **消除有 Root / 无 Root 死循环与后台唤醒 (`BrightScreenFastChargeService` / `FastChargeWatchdog` / `PassThroughService` / `DashboardScreen`)**：
              - 移除过热熔断或满电恢复后的无条件 `scheduleNodeSync` 与重复 `stat + chmod` 轮询，正常供电轮询间隔 `10s`；
              - 为 `JOB_ID_ARM` / `JOB_ID_KICK` 增加 `3s` 防抖与 `isNodesMayBeBlocked` 按需重调度，防止 `stopSelf` ↔ `JobScheduler` 乒乓唤醒；
              - 无 Root 时 `BrightScreenFastChargeService` 与 `PassThroughService` 快速熔断退出，Root 恢复授权后自动解除挂起并同步；`DashboardScreen` 将状态检查由 2.5s 轮询改为 `ON_RESUME` 刷新。
            - **智能温控采样与兜底 (`FastChargeController.readBatteryMetrics`)**：
              - 优先读取免解锁 `__wt_tzb` 与 sec 热敏电阻，跳过常规 `chmod` 临时解锁；保留在 `__wt_tzb` 无效、连续 `6` 次卡死、距温控阈值 `3.0°C` 以内或距上次直接校验超过 `60s` 时的自动临时解锁兜底。
            - **验证状态**：
              - 本地单元测试 15 个套件共 134 项全部通过（含 `FastChargeSafetyTest` 新增 4 项安全回归测试）；R8 Release 构建通过。
              - 真机实测（插拔线通知、满电 100% 退场与拔插闭环、无 Root 熔断功耗）待真机接入后进一步确认。
          files: |
            releases/WeiTiao-v1.6.3.apk
            releases/WeiTiao-v1.6.3.apk.sha256
