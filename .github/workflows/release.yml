name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.5.4.apk
          cd releases
          sha256sum WeiTiao-v1.5.4.apk > WeiTiao-v1.5.4.apk.sha256
          cat WeiTiao-v1.5.4.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.4
          name: "微调 WeiTiao v1.5.4 (亮屏快充温控安全重构 · 根除 0000 节点残留锁死与 SoC 温控瘫痪隐患)"
          body: |
            ### 微调 (WeiTiao) v1.5.4

            - **亮屏快充温控安全架构彻底重构 (`FastChargeController` / `BrightScreenFastChargeService` / `FastChargeWatchdog`)**：
              - **保留 CPU (`AP`) / 射频 (`PA`) / GPU (`gpu_tmu`) / `thermal` 硬件温控保护**：
                - 亮屏快充仅屏蔽电源与电池充电限流节点 (`batt_temp`、`chg_temp`、`dchg_temp` 等)，严禁再将 `sec-ap-thermistor`、`sec-pa-thermistor`、`sec-wf-thermistor`、`gpu_tmu` 及 `/sys/class/thermal` 设为 `0000`，并在每次操作时主动恢复这些节点为可读状态，杜绝 SSRM 误判整机 `-88.8°C` (`LowTemp`) 而关闭 CPU/GPU/射频过热降频。
              - **修复 `17:05:31` 熔断后被后台 JobService 重新锁死为 `0000` 及拔线后残留锁死的 Bug**：
                - 修复 `FastChargeJobService` (`FastChargeFallback.applyNow`) 在常驻服务已处于高温熔断 (`isOverheated = true`) 状态下越权调用 `blockTemperatureNodes()`，而常驻服务因内存 `appliedBlocked == false` 不再执行恢复的致命竞态；
                - 常驻服务在熔断、息屏、拔电状态下新增每 15 秒双向硬件权限强校验 (`isAnyTemperatureNodeBlocked`) 与拔线/息屏/包更新/应用启动 (`App.onCreate`) 无条件强制解锁自愈机制；
                - `FastChargeJobService.onStopJob` 新增拔线即时解锁回调，即使常驻服务被系统强杀，拔掉充电器瞬间也 100% 恢复全部温控节点。
              - **多路真实温度采样与「电池/中框 + 芯片峰值」双重安全熔断**：
                - 移除错误的 `batt_temp_raw`（NTC 原始 ADC 值）与 `normalizeTemp` 中的 `abs()`（防止将 `-888` 负温错误码当成正温）；
                - 采样时通过亚毫秒级瞬时可读探针读取真实 `batt_temp`、`chg_temp`、`dchg_temp`、`sec-cf-thermistor`、`sec-ap-thermistor`、`sec-pa-thermistor`，当电池/中框达到设定阈值或 AP/CHG/PA 芯片达到安全上限（`<= 50°C`）时立即熔断恢复官方温控。
          files: |
            releases/WeiTiao-v1.5.4.apk
            releases/WeiTiao-v1.5.4.apk.sha256
