name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.5.3.apk
          cd releases
          sha256sum WeiTiao-v1.5.3.apk > WeiTiao-v1.5.3.apk.sha256
          cat WeiTiao-v1.5.3.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.3
          name: "微调 WeiTiao v1.5.3 (Google Play 版微信 8.0.79+ 步数修改修复 · 双层计步拦截与主动平滑递增)"
          body: |
            ### 微调 (WeiTiao) v1.5.3

            - **全面修复 Google Play 版及国内版微信 8.0.79+ 步数修改失效问题 (`WechatHooks`)**：
              - **双层计步传感器拦截（彻底免疫 `targetSdk >= 34` Hidden API 限制）**：
                - 第一层：修复 `mSensorsEvents` 字段查找（遍历父类 `SystemSensorManager$BaseSensorEventQueue`），并移除错误的 `sensor.hashCode()` 伪造 `handle` 回退；
                - 第二层：在 `SensorManager.registerListener` / `SystemSensorManager.registerListenerImpl` 注册计步器时，基于 100% 公开 Android SDK API（`Sensor.getType()`、`SensorEvent.sensor`、`SensorEvent.values`）动态 Hook 目标 `SensorEventListener.onSensorChanged(SensorEvent)`，彻底绕开 Google Play 版微信 8.0.79 (`targetSdk >= 34`) 触发的隐藏字段反射封锁。
              - **根除加速度计/陀螺仪高频误判与单帧暴涨防作弊丢弃**：
                - 彻底移除 `(sensor == null && values[0] > 0f)` 兜底判断，严禁 50Hz 加速度计/陀螺仪事件混入计步引擎导致第一帧与第二帧之间直接冲顶 `50,000` 步被微信判定为异常突跳丢弃；
                - 新增首帧基准锚点保护（首帧 `0` 突跳建立 `preSensorStep` 基准）与单次事件平滑增量上限（`<= 2000` 步/帧）。
              - **新增后台平滑主动计步驱动器 (`WeiTiao-StepTicker`)**：
                - 解决手机静置桌面时硬件 `TYPE_STEP_COUNTER` (`ON_CHANGE` 模式) 不触发第二次事件导致自动步数卡在 `0` 的问题，静置状态下也能平滑、稳定地将微信运动步数推升至设定上限。
            - **微信进程隔离保护 (`CscSpoof` & `MainHook`)**：
              - 在全局默认「全部作用域应用」机型伪装模式下默认排除微信 (`com.tencent.mm`)，防止全局伪装为 `iPhone Duo`（`Apple / iPhone19,4`）及 `NativePropCow` 注入干扰微信主进程与 `:push` 进程健康度及计步器权限。
          files: |
            releases/WeiTiao-v1.5.3.apk
            releases/WeiTiao-v1.5.3.apk.sha256
