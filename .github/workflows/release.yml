name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.5.6.apk
          cd releases
          sha256sum WeiTiao-v1.5.6.apk > WeiTiao-v1.5.6.apk.sha256
          cat WeiTiao-v1.5.6.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.6
          name: "微调 WeiTiao v1.5.6 (亮屏快充单通知状态机重构 · 根除待命常驻与双通知并存问题)"
          body: |
            ### 微调 (WeiTiao) v1.5.6

            - **亮屏快充通知架构合并与统一状态机 (`FastChargeNotifier` / `BrightScreenFastChargeService`)**：
              - **单通知 ID 原地切换 (`NOTIFICATION_ID = 19077`)**：彻底废弃旧版 `19076` 常驻服务通知 ID，前台服务保活与充电实时数据合并共用唯一 ID `19077`；未插电待命态绑定 `IMPORTANCE_NONE` 隐藏渠道使通知栏完全不显示「亮屏快充」条目，插电充电态（含亮屏快充、息屏安全充电、高温保护恢复原生温控）在同一通知 ID 上原地刷新。
              - **覆盖安装自动清理旧版残留与防渠道篡改保护**：新增带版本号的 `cleanupLegacyIfNeeded` 一次性自动清理旧版 `19076` 残留通知与旧渠道；当后台隐藏渠道重要性被外部误改时，采用「先新建隐藏渠道并切换前台通知绑定、再删除旧渠道」的无感轮转保护（上限 3 次），同时 100% 尊重用户对「亮屏快充」可见通知类别的开关设置。
              - **全链路拔线兜底一致性 (`FastChargeReceiver` / `FastChargeWatchdog`)**：统一常驻服务、静态广播与 `JobService.onStopJob` 拔线恢复路径，拔线瞬间立即切回隐藏态、恢复官方温控节点并重新布防插电触发器。
          files: |
            releases/WeiTiao-v1.5.6.apk
            releases/WeiTiao-v1.5.6.apk.sha256
