name: Build & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          test -f releases/WeiTiao-v1.6.4.apk
          cd releases
          sha256sum WeiTiao-v1.6.4.apk > WeiTiao-v1.6.4.apk.sha256
          cat WeiTiao-v1.6.4.apk.sha256

      - name: Create GitHub Release and Upload APK + Checksum
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.4
          name: "微调 WeiTiao v1.6.4 (对齐原版 17 节点 AC 亮屏快充、低电流踢一脚与电池温度硬熔断)"
          body: |
            ### 微调 (WeiTiao) v1.6.4 (`versionCode=44`)

            - **全面对齐 S8Tweak 原版 17 节点屏蔽范围 (`FastChargeController`)**：
              - `blockTemperatureNodes` 重新覆盖全部 17 个温控节点（电池/充电路由 8 项 + AP/CP/PA/WF/机身 6 项热敏 + `lcd/panel` + `gpu_tmu` + `/sys/class/thermal`），彻底打穿三星 SSRM/SIOP 亮屏限流；拔线、非 AC 充、满电 100% 或过热熔断时恢复目录 `0755` / 文件 `0644`。
            - **仅对 AC 有线充电生效 & 取消息屏反复撤回 (`BrightScreenFastChargeService` / `FastChargeWatchdog` / `TuningConfig`)**：
              - 仅在 `BATTERY_PLUGGED_AC` 时启动亮屏快充并写入三星快充系统开关，插 USB/无线充时不误锁节点、不触发 JobScheduler 乒乓唤醒；
              - AC 充电期间不再因息屏撤回节点或临时 `chmod 0444` 解锁 `batt_temp`，消除亮/息屏切换及定时解锁漏风口。
            - **低电流「踢一脚」自动重协商 + 防抖冷却 (`BrightScreenFastChargeService`)**：
              - 当电量 `< 85%` 且连续 2 次实测电流处于 `1..999mA` 慢充态时，自动临时恢复节点 5 秒后再重新屏蔽全部 17 个节点拉回快充；内置 `60s` 冷却与连续 `3` 次上限，避免老旧慢充头无限重试。
            - **仅依电池自身温度触发硬熔断 + 延续 v1.6.3 零功耗底座 (`FastChargeController` / `App` / `FastChargeNotifier`)**：
              - 过热熔断剔除 AP/PA 芯片温度干扰，仅按免解锁采集（与系统广播 `EXTRA_TEMPERATURE`）获得的电池自身温度及用户阈值（默认 44°C，降温 3°C 恢复）判定；
              - 保留未充电零通知零服务、100% 满电退场与拔插闭环、无 Root 自动挂起。
            - **验证状态**：
              - 本地单元测试 15 个套件共 134 项全部通过（含 `FastChargeSafetyTest` 覆盖 AC 门控、17 节点校验、电池单温熔断与低电流重协商用例）；R8 Release 构建通过。
              - 真机实测（AC 亮屏充电电流、全节点屏蔽下 `EXTRA_TEMPERATURE` 温升刷新与低电流踢一脚实效）待接入真机后进一步验证。
          files: |
            releases/WeiTiao-v1.6.4.apk
            releases/WeiTiao-v1.6.4.apk.sha256
